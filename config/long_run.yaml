experiment:
  name: long_run
  description: "Long, low-frequency-output jem run (one snapshot per file, no real time coordinate)"

# ── Data paths ───────────────────────────────────────────────────────────────
data:
  # Directory containing {component}-*.nc files (atm/ocn/fakelnd).
  run_dir: data/long_run

# ── Grid metadata ─────────────────────────────────────────────────────────────
# Only the cartopy projection needs to be configured here — horizontal/
# vertical dimension names and real-vs-synthetic coordinates are detected
# automatically per variable (see jemdiag/grid.py).
grids:
  atm:
    projection: PlateCarree
  fakelnd:
    projection: PlateCarree
  # ocn is intentionally omitted: map_2d picks cartopy or a plain index-based
  # fallback automatically depending on whether its coordinates are real.

# ── Diagnostics ───────────────────────────────────────────────────────────────
# Two-layer structure: component -> diag_type -> settings.
# `time`/`level` accept "mean", an integer index, a "start:end" slice
# (averaged over the slice), or a list of any of those to produce one plot
# per entry (e.g. `time: [0, 12, mean]`) -- jem runs have no calendar, so
# aggregation is always over raw file/record index rather than season/month.
diagnostics:
  # Shared `time` selection for every non-timeseries diag_type below (map_2d,
  # zonal_section, profile, overturning_streamfunction, heat_transport).
  # timeseries plots the full time axis and ignores this. Any diag_type
  # block may still set its own `time` to opt out of the shared default.
  time: 481:500

  atm:
    map_2d:
      level: mean
      vars: [temperature, u_wind, v_wind, specific_humidity, shortwave_rad.rsds, surface_flux.tsfc]
      # Optional per-variable overrides. Any key may be omitted to keep the
      # automatic default (percentile-based color limits, DEFAULT_CMAPS entry
      # or "viridis").
      # var_opts:
      #   temperature: {vmin: 200, vmax: 300}
      #   u_wind: {symmetric: true}
    zonal_section:
      invert_yaxis: false
      vars: [temperature, u_wind]
    profile:
      vars: [specific_humidity, temperature]
    timeseries:
      level: mean
      vars: [surface_flux.tsfc, shortwave_rad.rsds]

  ocn:
    map_2d:
      level: mean
      vars: [sea_surface_temperature]
    zonal_section:
      # depth index 0 = seafloor, last index = surface (jem convention);
      # invert_yaxis: false keeps the surface drawn at the top of the chart.
      invert_yaxis: false
      vars: [temp, salt]
    timeseries:
      level: mean
      vars: [sea_surface_temperature]
    zonal_mean:
      vars: [sea_surface_temperature, sea_surface_salinity]
    overturning_streamfunction:
      invert_yaxis: false
      lon_bands:
        - [0, 360]
        - [0, 60]
        - [60, 360]
    heat_transport: {}

  fakelnd:
    map_2d:
      vars: [mixed_layer_depth]
    timeseries:
      vars: [mixed_layer_depth, total_heat_flux]

# ── Output ────────────────────────────────────────────────────────────────────
output:
  base_dir: figures
  # Final path: {base_dir}/{experiment.name}/{component}/{diag_type}/{variable}.png
  format: png
  dpi: 150
  n_levels: 20  # number of discrete color levels in all map/zonal plots
