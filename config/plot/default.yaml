# Plot config: *how* to plot a jem run -- grids, diagnostics and output.
# Shared across simulations; pair it with a simulation config from
# config/sim/ (`plot_jem.py run --sim ... --plot ...`). Anything that is
# specific to one run (its analysis `time` window, `coastlines` for a
# real-topography run, ...) belongs in that run's simulation config as a
# `diagnostics` override, which is deep-merged over this file.

# ── Grid metadata ─────────────────────────────────────────────────────────────
# Only the cartopy projection needs to be configured here — horizontal/
# vertical dimension names and real-vs-synthetic coordinates are detected
# automatically per variable (see jemdiag/grid.py).
grids:
  atm:
    projection: PlateCarree
  lnd:
    projection: PlateCarree
  seaice:
    projection: PlateCarree
  # ocn is intentionally omitted: map_2d picks cartopy or a plain index-based
  # fallback automatically depending on whether its coordinates are real.

# ── Diagnostics ───────────────────────────────────────────────────────────────
# Two-layer structure: component -> diag_type -> settings.
# `time`/`level` accept "mean", an integer index, a "start:end" slice
# (averaged over the slice), or a list of any of those to produce one plot
# per entry (e.g. `time: [0, 12, mean]`) -- jem runs have no calendar, so
# aggregation is always over raw file/record index rather than season/month.
diagnostics:
  # Shared `time` selection for every non-timeseries diag_type below (map_2d,
  # zonal_section, profile, overturning_streamfunction, heat_transport).
  # timeseries plots the full time axis and ignores this. Any diag_type
  # block may still set its own `time` to opt out of the shared default.
  # The useful window depends on the run's length, so simulation configs
  # normally override this.
  time: mean

  # Draw Earth coastlines on every map_2d figure. Only meaningful for runs
  # configured with real Earth topography — an idealized/aqua-planet run
  # would get an outline that doesn't match its own land-sea mask. May also
  # be a mapping of style overrides ({resolution: 110m|50m|10m, color,
  # linewidth}), and any map_2d block may set its own `coastlines` to
  # override this shared default.
  coastlines: false

  # Longitude (degrees east) at the center of every map_2d figure; 0 if
  # omitted. Set e.g. 200 to keep the Pacific whole instead of split across
  # the two edges. Any map_2d block may override this shared default.
  central_longitude: 0

  atm:
    map_2d:
      level: mean
      vars: [temperature, u_wind, v_wind, specific_humidity, shortwave_rad.rsds, surface_flux.tsfc, precipitation]
      # Optional per-variable overrides. Any key may be omitted to keep the
      # automatic default (percentile-based color limits, DEFAULT_CMAPS entry
      # or "viridis").
      # var_opts:
      #   temperature: {vmin: 200, vmax: 300}
      #   u_wind: {symmetric: true}
    zonal_section:
      # sigma levels: the code default (true) puts the surface at the bottom.
      invert_yaxis: true
      vars: [temperature, u_wind]
    profile:
      vars: [specific_humidity, temperature]
    timeseries:
      running_mean_steps: 5  # 5 x 73-day records = 1 year
      level: mean
      vars: [surface_flux.tsfc, shortwave_rad.rsds]
    zonal_mean:
      vars: [precipitation]
    heat_transport:
      method: radiative

  ocn:
    map_2d:
      level: mean
      vars: [sea_surface_temperature, sea_surface_salinity]
    zonal_section:
      # depth index 0 = seafloor, last index = surface (jem convention);
      # invert_yaxis: false keeps the surface drawn at the top of the chart.
      invert_yaxis: false
      vars: [temp, salt]
    timeseries:
      running_mean_steps: 5  # 5 x 73-day records = 1 year
      level: mean
      vars: [sea_surface_temperature]
    zonal_mean:
      vars: [sea_surface_temperature, sea_surface_salinity]
    overturning_streamfunction:
      invert_yaxis: false
      lon_bands:
        - [0, 360]
        - [0, 60]
        - [60, 360]
    heat_transport:
      lon_bands:
        - [0, 360]
        - [0, 60]
        - [60, 360]

  lnd:
    map_2d:
      # `level` reduces the soil `layer` dim of soil-water variables.
      level: mean
      vars: [land_surface_temperature, soil_water_availability, snow_depth]
    timeseries:
      running_mean_steps: 5  # 5 x 73-day records = 1 year
      vars: [land_surface_temperature, soil_water_availability]

  seaice:
    map_2d:
      vars: [ice_fraction, ice_thickness]

# ── Output ────────────────────────────────────────────────────────────────────
output:
  base_dir: figures
  # Final path: {base_dir}/{experiment.name}/{component}/{diag_type}/{variable}.png
  format: png
  dpi: 150
  n_levels: 20  # number of discrete color levels in all map/zonal plots
